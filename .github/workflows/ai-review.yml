name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Modes: "observer" (comment only), "suggest" (recommend merge), "auto" (merge after human gate)
  REVIEW_MODE: auto

jobs:
  ai-review:
    name: Multi-Agent AI Review
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      confidence: ${{ steps.review.outputs.confidence }}
      auto_merge_eligible: ${{ steps.review.outputs.auto_merge_eligible }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt 2>&1; then
            echo "::error::Failed to fetch PR diff — cannot run AI review"
            exit 1
          fi
          LINES_CHANGED=$(wc -l < pr_diff.txt)
          echo "lines_changed=$LINES_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run AI Review Agents
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DIFF: ${{ github.event.pull_request.diff_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          LINES_CHANGED: ${{ steps.diff.outputs.lines_changed }}
          REVIEW_MODE: ${{ env.REVIEW_MODE }}
        run: |
          # Pass diff as file path to avoid shell env size limits on large PRs
          export PR_DIFF_FILE="pr_diff.txt"
          node .github/scripts/ai-review.js

      - name: Upload critique artifact
        uses: actions/upload-artifact@v4
        with:
          name: critique
          path: critique.json
          retention-days: 1

  # ---- Fix Agent Loop ----
  # Runs when AI verdict is FAIL or WARN, up to 3 iterations.
  # Checks out with FIX_AGENT_PAT so the push re-triggers this workflow.
  fix-loop:
    name: Fix Agent
    needs: ai-review
    if: |
      needs.ai-review.outputs.verdict == 'FAIL' ||
      needs.ai-review.outputs.verdict == 'WARN'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout with PAT (enables push re-trigger)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FIX_AGENT_PAT }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Count existing fix-agent commits
        id: iteration
        run: |
          COUNT=$(git log --oneline "${{ github.event.pull_request.base.sha }}"..HEAD \
            | grep -c "fix(agent):" || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then
            echo "max_reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "max_reached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify max iterations reached
        if: steps.iteration.outputs.max_reached == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "🤖 **Fix Agent:** Maximum iterations (3) reached. Manual review required."

      - name: Set up Node.js
        if: steps.iteration.outputs.max_reached == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Download critique artifact
        if: steps.iteration.outputs.max_reached == 'false'
        uses: actions/download-artifact@v4
        with:
          name: critique

      - name: Run Fix Agent
        if: steps.iteration.outputs.max_reached == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRITIQUE_FILE: critique.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          FIX_ITERATION: ${{ steps.iteration.outputs.count }}
        run: node .github/scripts/fix-agent.js

      - name: Commit and push fixes
        if: steps.iteration.outputs.max_reached == 'false'
        run: |
          git config user.name "Fix Agent"
          git config user.email "fix-agent@github-actions.local"
          git add src/ tests/
          if git diff --cached --quiet; then
            echo "No file changes — nothing to commit."
          else
            ITER=${{ steps.iteration.outputs.count }}
            git commit -m "fix(agent): iteration $((ITER + 1)) — auto-fix AI review findings"
            git push
            echo "Fixes pushed. AI review will re-run automatically."
          fi

  # ---- Human Approval Gate ----
  # This job only runs if AI says PASS and mode is "auto"
  # Requires a GitHub Environment "production" with required reviewers configured
  human-gate:
    name: Human Approval
    needs: ai-review
    if: needs.ai-review.outputs.auto_merge_eligible == 'true'
    runs-on: ubuntu-latest
    environment: production   # <-- Configure required reviewers in repo Settings > Environments
    steps:
      - name: Approval received
        run: echo "Human approved the merge"

  # ---- Auto-merge after human approval ----
  merge:
    name: Merge PR
    needs: [ai-review, human-gate]
    if: needs.ai-review.outputs.auto_merge_eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto
